name: Build ProjectA Plot Runner (Windows exe)

on:
  push:
    branches: [main, "netbuild/**"]
    paths: ["ProjectA_PlotRunner/**", ".github/workflows/build-plot-exe.yml"]
  pull_request:
    paths: ["ProjectA_PlotRunner/**", ".github/workflows/build-plot-exe.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install pyinstaller==6.11.1

      - name: Unit tests (Windows, includes the window test)
        run: python -m unittest discover -s ProjectA_PlotRunner/tests -v

      - name: Build ProjectA_PlotRunner.exe (window) and ProjectAPlot.exe (command line)
        working-directory: ProjectA_PlotRunner
        run: |
          pyinstaller --noconfirm --onefile --windowed --name ProjectA_PlotRunner ProjectA_PlotRunner.pyw
          pyinstaller --noconfirm --onefile --console --name ProjectAPlot ProjectAPlot_cli.py

      - name: Smoke test the frozen exe
        run: python ProjectA_PlotRunner/tests/smoke_exe.py ProjectA_PlotRunner/dist/ProjectAPlot.exe

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg/ProjectA_PlotRunner | Out-Null
          Copy-Item ProjectA_PlotRunner/dist/ProjectA_PlotRunner.exe, ProjectA_PlotRunner/dist/ProjectAPlot.exe, ProjectA_PlotRunner/README.md pkg/ProjectA_PlotRunner/
          Get-ChildItem pkg/ProjectA_PlotRunner | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ProjectA_PlotRunner-windows
          path: pkg/
          retention-days: 90
